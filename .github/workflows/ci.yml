name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    
    # `tests/` is flat: 55 `test_*.py` files, no subdirectories, and there is no
    # commit in which there were any. This step read `pytest tests/unit` and the
    # next read `pytest tests/integration`, so pytest exited 4 ("file or
    # directory not found") before collecting a single test — on every matrix
    # version, since the file was written. The suite it was skipping is 1134
    # tests. TESTING.md documents `pytest tests/`, which is what this now runs;
    # the unit/integration split lives in pytest markers (pyproject.toml), not
    # in paths.
    - name: Run tests
      run: |
        pytest tests/ -v --cov=accelerapp --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    # 3.12, not 3.11. pyproject's [tool.black] target-version includes py312, and
    # black's safety check re-parses its own output with the *running* interpreter:
    # under 3.11 it cannot parse code targeted at 3.12 and warns
    # "Python 3.11 cannot parse code formatted for Python 3.12". Match the highest
    # version the project claims to support (requires-python = ">=3.8", classifiers
    # and the test matrix both go to 3.12) rather than narrowing target-version,
    # which would drop a supported version to suit the linter.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Pinned. These were unpinned, so the next black release could reformat the
    # tree and turn main red without a commit touching it -- which is roughly how
    # this job came to be red for the best part of a year.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black==26.5.1 flake8 isort==9.0.1 mypy bandit

    - name: Check code formatting with black
      run: |
        black --check --line-length=100 src/
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --profile black --line-length=100 src/
    
    # 4,728 -> 519 (black + isort) -> 2. The 519 were not formatting but code,
    # and were fixed as code in three passes: 365 mechanical ones, then 100 dead
    # imports with 21 re-exports marked `# noqa: F401` because a package's
    # __init__ re-exporting a name is not an unused import, then the 31 that were
    # judgement calls -- among them one real runtime bug, a second
    # `class WebSocketClient` shadowing the first in the same module.
    #
    # The last 2 were one line, `src/accelerapp/core/__init__.py:58`, and three
    # attempts at placing a `# noqa` there failed the same way -- isort regroups
    # the line and strips the marker. The fix was not a fourth placement. That
    # file's `__all__` was a plain list followed by a second block that read
    #
    #     try: __all__.extend([...]); except NameError: pass
    #
    # as though the v2.0 names were exported conditionally. They were not: the
    # list holds string literals, so the extend cannot raise NameError and the
    # guard had never once fired. pyflakes honours a plain module-level
    # `__all__` and not one built inside a `try`, so folding the two together
    # took the count to 0 and changed nothing at runtime -- 31 exported names
    # before and after, verified by importing both revisions.
    #
    # No ignore-list entry was added. `--extend-ignore=F401` would have hidden
    # every genuine unused import in the tree to silence two that were not.
    - name: Lint with flake8
      run: |
        flake8 src/ --max-line-length=100 --extend-ignore=E203,E266,E501,W503 --statistics

    - name: Type check with mypy
      run: |
        mypy src/ --ignore-missing-imports --check-untyped-defs || true

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ || true
    
    - name: Check dependencies with Safety
      run: |
        safety check --json || true
    
    # v3 was retired by GitHub: every job using it is failed automatically
    # before its step runs, whatever the step would have done.
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json

  # A "Performance Tests" job stood here and ran `pytest tests/performance`, a
  # directory that has never existed. `pyproject.toml` does define a
  # `performance` marker, but **no test carries it** — `-m performance` collects
  # nothing and pytest exits 5. So the job had two possible outcomes, red or a
  # green that asserted nothing, and it has only ever been red.
  #
  # Removed rather than pointed at the marker: a gate over an empty set is a
  # claim the code does not support. When performance tests are written, mark
  # them and bring the job back — `pytest tests/ -m performance`.

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
