name: Docker Build and Push

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        target: [production, development]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
        flavor: |
          suffix=-${{ matrix.target }},onlatest=true
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deployment/docker/Dockerfile
        target: ${{ matrix.target }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
    
    # Three things were wrong with this step, and it has never run to completion:
    #
    #   1. `${{ github.repository }}` is `thewriterben/Accelerapp`. Docker
    #      requires a lowercase repository name, so every invocation died with
    #      "invalid reference format" before pulling anything.
    #   2. The tag it built by hand, `<full 40-char sha>-production`, is not one
    #      the metadata action produces — that is `sha-<short>-production`. So
    #      the reference named an image that does not exist even on main.
    #   3. On a pull request `push:` above is false and this is a two-platform
    #      build, so `load: true` is not available either: there is no image on
    #      the runner and none in the registry. Nothing to test.
    #
    # So: use the tag the metadata action actually emitted (first line), and run
    # only when the image was pushed. On a PR the step is skipped, which is the
    # honest report — the build is still exercised by the step above.
    - name: Test Docker image
      if: matrix.target == 'production' && github.event_name != 'pull_request'
      run: |
        image="$(printf '%s\n' "$DOCKER_METADATA_OUTPUT_TAGS" | head -n1)"
        echo "testing $image"
        docker run --rm "$image" accelerapp --version || true
        docker run --rm "$image" accelerapp info

  build-compose:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    # `docker-compose` (the standalone v1 binary) is no longer on the GitHub
    # runners; Compose is a CLI plugin invoked as `docker compose`. Every step
    # in this job died with "docker-compose: command not found" (exit 127) the
    # first time the job ran at all — it had been skipped until now, because
    # `needs: build-and-push` and that job could not build the development
    # image while .dockerignore excluded tests/.
    - name: Build Docker Compose services
      run: |
        cd deployment/docker
        docker compose build --no-cache

    # `--no-deps`, because `accelerapp` depends_on `ollama`, and the ollama
    # service reserves an NVIDIA GPU (`deploy.resources.reservations.devices`).
    # GitHub's runners have no GPU, so bringing the dependency up fails with
    #   Error response from daemon: could not select device driver "nvidia"
    #                               with capabilities: [[gpu]]
    # and the failure is about the runner, not about anything in this repo.
    # Starting only the service under test is what the job was after: the
    # compose file parses, the image builds, and the container comes up.
    - name: Test Docker Compose services
      run: |
        cd deployment/docker
        docker compose up -d --no-deps accelerapp
        sleep 10
        docker compose ps
        docker compose logs accelerapp
        docker compose down

    - name: Clean up
      if: always()
      run: |
        cd deployment/docker
        docker compose down -v

  scan-security:
    name: Security Scan Docker Images
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    # Four faults, and the job had never reached Trivy. Two were the same ones
    # the "Test Docker image" step above was repaired for; the other two are
    # this job's own, and are why *both* of its steps failed rather than one:
    #
    #   1. `${{ github.repository }}` is `thewriterben/Accelerapp`. Docker
    #      requires a lowercase repository name, so the reference was invalid
    #      before anything was pulled.
    #   2. `<full 40-char sha>-production` is not a tag the metadata action
    #      emits. With `type=sha` and `suffix=-production` it emits
    #      `sha-<short>-production`, so the reference named nothing that exists.
    #   3. No registry login. `build-and-push` logs in, but that is a different
    #      job on a different runner, so Trivy had no credentials for ghcr.
    #   4. No `security-events: write`. `upload-sarif` needs it, and the job
    #      declared no permissions at all — which is why that step failed
    #      independently of Trivy, and would have kept failing even once the
    #      image reference was right.
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Built here rather than passed from `build-and-push`, because that job is a
    # matrix and its outputs are not safe to rely on: every leg writes the same
    # key, and the leg that does not set it writes an empty string over the one
    # that did. This mirrors `type=sha` + `suffix=-${{ matrix.target }}` from the
    # metadata step above — if that tag scheme changes, this changes with it.
    - name: Work out the production image reference
      id: ref
      run: |
        repo="$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
        image="${{ env.REGISTRY }}/${repo}:sha-${GITHUB_SHA::7}-production"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "scanning $image"

    # Fail here, naming the tag, rather than letting Trivy report a confusing
    # manifest error four steps later.
    - name: Check the image is actually there
      run: |
        if ! docker manifest inspect "${{ steps.ref.outputs.image }}" > /dev/null 2>&1; then
          echo "::error::no image at ${{ steps.ref.outputs.image }} — the tag scheme in build-and-push and the one built above have drifted apart"
          exit 1
        fi

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.ref.outputs.image }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Trivy vulnerability scanner (table format)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.ref.outputs.image }}
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'

  publish-manifest:
    name: Create Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create and push manifest
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        docker manifest create \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-production
        docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}
        
        docker manifest create \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-production
        docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
